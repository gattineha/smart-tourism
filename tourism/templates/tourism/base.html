<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Tourism</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'destination_list' %}">Smart Tourism</a>
    <div class="d-flex align-items-center gap-2">
      {% if user.is_authenticated %}
        <span class="text-white">Hi, {{ user.username }}</span>
        <form method="post" action="{% url 'logout' %}" class="d-inline">
          {% csrf_token %}
          <button class="btn btn-sm btn-outline-light">Logout</button>
        </form>
      {% else %}
        <a class="btn btn-sm btn-outline-light" href="{% url 'login' %}">Login</a>
        <a class="btn btn-sm btn-light" href="{% url 'register' %}">Register</a>
      {% endif %}
    </div>
  </div>
</nav>
<div class="container">
  {% block content %}{% endblock %}
</div>
</body>
</html>
