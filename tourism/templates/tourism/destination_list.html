{% extends 'tourism/base.html' %}
{% block content %}
<h3 class="mb-3">Explore Destinations</h3>

<form method="get" class="row g-2 mb-4">
  <div class="col-md-5">
    <input type="text" name="q" value="{{ q }}" class="form-control" placeholder="Search by name or district">
  </div>
  <div class="col-md-4">
    <select name="category" class="form-select">
      <option value="">All categories</option>
      {% for c in categories %}
        <option value="{{ c.id }}" {% if selected_category == c.id|stringformat:"s" %}selected{% endif %}>{{ c.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-3">
    <button class="btn btn-primary w-100">Search</button>
  </div>
</form>

<div class="row">
  {% for d in destinations %}
    <div class="col-md-4 mb-4">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title">{{ d.name }}</h5>
          <p class="text-muted mb-1">{{ d.district }} &middot; {{ d.category.name }}</p>
          <p class="card-text">{{ d.description|truncatewords:20 }}</p>
          <a href="{% url 'destination_detail' d.pk %}" class="btn btn-outline-primary btn-sm">View details</a>
        </div>
      </div>
    </div>
  {% empty %}
    <p>No destinations found.</p>
  {% endfor %}
</div>
{% endblock %}
