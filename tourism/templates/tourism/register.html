{% extends 'tourism/base.html' %}
{% block content %}
<div class="col-md-5 mx-auto">
  <h3>Register</h3>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-success">Create account</button>
  </form>
  <p class="mt-3">Already registered? <a href="{% url 'login' %}">Login</a></p>
</div>
{% endblock %}
