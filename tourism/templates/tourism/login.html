{% extends 'tourism/base.html' %}
{% block content %}
<div class="col-md-5 mx-auto">
  <h3>Login</h3>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary">Login</button>
  </form>
  <p class="mt-3">New user? <a href="{% url 'register' %}">Register here</a></p>
</div>
{% endblock %}
